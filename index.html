<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2a2b">
<title>Money Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef1ef;
    --ink: #14211f;
    --header: #0f2a2b;
    --header-text: #f3f1ea;
    --header-muted: #9db3b0;
    --accent: #d9c9a0;
    --muted: #5d6d6a;
    --line: #d5dcd9;
    --surface: #f8faf9;

    /* spacing yang berubah mengikut saiz skrin */
    --gutter: 1.25rem;
    --content-max: 100%;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1514;
      --ink: #e8eeec;
      --muted: #94a8a5;
      --line: #223634;
      --surface: #112321;
    }
  }

  * { box-sizing: border-box; margin: 0; }
  html {
    -webkit-text-size-adjust: 100%;
    scroll-behavior: smooth;
  }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.6;
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
  }

  /* ---------- Header ---------- */
  header {
    background: var(--header);
    color: var(--header-text);
    padding-top: calc(2rem + env(safe-area-inset-top, 0px));
    padding-bottom: 1.5rem;
    padding-left: calc(var(--gutter) + env(safe-area-inset-left, 0px));
    padding-right: calc(var(--gutter) + env(safe-area-inset-right, 0px));
  }
  .header-inner {
    max-width: var(--content-max);
    margin: 0 auto;
  }
  h1 {
    font-family: "Instrument Serif", Georgia, "Times New Roman", serif;
    font-weight: 400;
    font-size: clamp(2.75rem, 13vw, 7.5rem);
    line-height: 0.95;
    letter-spacing: -0.02em;
    overflow-wrap: anywhere;
  }

  /* ---------- Navbar ---------- */
  nav {
    display: grid;
    grid-template-columns: repeat(3, 1fr);   /* mobile: 3 butang sama lebar */
    gap: 0.5rem;
    margin-top: 1.5rem;
  }
  nav button {
    font: inherit;
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--header-muted);
    background: transparent;
    border: 1px solid rgba(243, 241, 234, 0.22);
    border-radius: 999px;
    min-height: 44px;                         /* saiz sentuhan selesa */
    padding: 0.5rem 0.75rem;
    cursor: pointer;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  nav button[aria-current="page"] {
    background: var(--accent);
    border-color: var(--accent);
    color: #1a2523;
  }
  nav button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }
  @media (hover: hover) {
    nav button:not([aria-current="page"]):hover {
      color: var(--header-text);
      border-color: rgba(243, 241, 234, 0.55);
    }
  }

  /* ---------- Kandungan ---------- */
  main {
    max-width: var(--content-max);
    margin: 0 auto;
    padding-top: 2rem;
    padding-bottom: calc(3rem + env(safe-area-inset-bottom, 0px));
    padding-left: calc(var(--gutter) + env(safe-area-inset-left, 0px));
    padding-right: calc(var(--gutter) + env(safe-area-inset-right, 0px));
  }
  section[hidden] { display: none; }
  h2 {
    font-family: "Instrument Serif", Georgia, serif;
    font-weight: 400;
    font-size: clamp(1.75rem, 5vw, 2.5rem);
    margin-bottom: 0.5rem;
  }
  .empty {
    color: var(--muted);
    max-width: 52ch;
  }

  /* ---------- Tablet (640px ke atas) ---------- */
  @media (min-width: 640px) {
    :root {
      --gutter: 2rem;
      --content-max: 760px;
    }
    header { padding-top: calc(3rem + env(safe-area-inset-top, 0px)); padding-bottom: 2rem; }
    .header-inner {
      display: flex;                          /* tajuk di kiri, navbar di kanan */
      flex-wrap: wrap;                        /* jika ruang tak cukup, navbar turun ke bawah */
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem 2rem;
    }
    h1 { font-size: clamp(2.25rem, 6.5vw, 3.75rem); }
    nav {
      display: flex;
      flex-wrap: nowrap;
      margin-top: 0;
    }
    nav button {
      font-size: 0.95rem;
      padding: 0.6rem 1.5rem;
    }
    main { padding-top: 2.5rem; }
  }

  /* ---------- Desktop (1024px ke atas) ---------- */
  @media (min-width: 1024px) {
    :root {
      --gutter: 3rem;
      --content-max: 1080px;
    }
    header { padding-top: calc(4.5rem + env(safe-area-inset-top, 0px)); padding-bottom: 2.5rem; }
    h1 { font-size: clamp(3.75rem, 6vw, 5.5rem); }
    nav { gap: 0.75rem; }
    nav button {
      font-size: 1rem;
      padding: 0.7rem 1.75rem;
    }
    main { padding-top: 3.5rem; padding-bottom: 5rem; }
  }

  /* ---------- Skrin besar (1440px ke atas) ---------- */
  @media (min-width: 1440px) {
    :root { --content-max: 1240px; }
  }

  /* ---------- Telefon landskap / skrin rendah ---------- */
  @media (max-height: 480px) and (orientation: landscape) {
    header { padding-top: calc(1rem + env(safe-area-inset-top, 0px)); padding-bottom: 1rem; }
    h1 { font-size: clamp(2rem, 8vh, 3rem); }
  }
  @media (max-height: 480px) and (orientation: landscape) and (max-width: 639px) {
    nav { margin-top: 0.75rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <h1>Money Tracker</h1>
    <nav aria-label="Menu utama">
      <button type="button" data-page="dashboard">Dashboard</button>
      <button type="button" data-page="income">Income</button>
      <button type="button" data-page="expense">Expense</button>
    </nav>
  </div>
</header>

<main>
  <section id="dashboard">
    <h2>Dashboard</h2>
    <p class="empty">Ringkasan pendapatan dan perbelanjaan anda akan dipaparkan di sini.</p>
  </section>

  <section id="income" hidden>
    <h2>Income</h2>
    <p class="empty">Rekod pendapatan harian anda akan dipaparkan di sini.</p>
  </section>

  <section id="expense" hidden>
    <h2>Expense</h2>
    <p class="empty">Rekod perbelanjaan harian anda akan dipaparkan di sini.</p>
  </section>
</main>

<script>
  var pages = ["dashboard", "income", "expense"];
  var buttons = document.querySelectorAll("nav button");

  function show(page) {
    if (pages.indexOf(page) === -1) page = "dashboard";
    pages.forEach(function (p) {
      document.getElementById(p).hidden = (p !== page);
    });
    buttons.forEach(function (b) {
      if (b.dataset.page === page) {
        b.setAttribute("aria-current", "page");
      } else {
        b.removeAttribute("aria-current");
      }
    });
  }

  buttons.forEach(function (b) {
    b.addEventListener("click", function () {
      location.hash = b.dataset.page;
    });
  });

  window.addEventListener("hashchange", function () {
    show(location.hash.slice(1));
  });

  show(location.hash.slice(1));
</script>

</body>
</html>
